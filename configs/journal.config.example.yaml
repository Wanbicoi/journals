# ==========================================
# APPEARANCE & NERD FONT SETTINGS
# ==========================================
appearance:
  use_nerd_font: true              # When true, uses Nerd Font glyphs; fallback to ASCII/unicode when false
  theme: "rose-pine-dawn"          # Color theme (rose-pine-dawn, rose-pine, nord, gruvbox, dracula, catppuccin)
  date_format: "YYYY-MM-DD"        # Daily stream grouping format
  time_format: "HH:mm"

# Customizable icons. Every glyph the TUI renders lives here.
# nerd = Nerd Font glyphs, plain = portable unicode/ASCII.
icons:
  nerd:
    journal: "\uf442"
    project: "\uf401"
    tag: "\uf02c"
    calendar: "\uf455"
    quick: "\uf0e7"
    warning: "\uf071"
    checked: "\uf4a7"
    unchecked: "\uf4a0"
    bullet: "\uf444"
    global: "\uf0ac"
    break: "\uf04c"
    status: "\uf111"
    done: "\uf058"
    todo: "\uf10c"
    pointer: "\uf054"
    cursor: "\uf0da"
    overdue: "\uf017"
    chartUp: "\uf062"
    chartDown: "\uf063"
    chartCursor: "\uf0d8"
  plain:
    journal: "◆"
    project: "◫"
    tag: "#"
    calendar: "📅"
    quick: "⚡"
    warning: "!"
    checked: "[x]"
    unchecked: "[ ]"
    bullet: "•"
    global: "🌐"
    break: "⏸"
    status: "●"
    done: "●"
    todo: "○"
    pointer: "❯"
    cursor: "▎"
    overdue: "⚠"
    chartUp: "▲"
    chartDown: "▼"
    chartCursor: "▲"

# ==========================================
# KEYMAP CONFIGURATION (grouped by scope)
# ==========================================
# Each screen answers its own scope; the same action name can appear in several
# scopes with the same or a different key. `global` is dispatched everywhere,
# the view scopes only while their view is on screen and no modal is open, and
# `modal` only while a modal is open.
keymaps:
  global:
    view_dashboard: "1"            # Switch to 60-day routine dashboard
    view_timeline: "2"             # Switch to daily timeline stream
    view_reflections: "3"          # Switch to periodic reflections view
    view_projects: "4"             # Switch to projects view & preview
    next_view: "tab"               # Cycle to the next view
    search_filter: "/"             # Open the search filter
    help: "?"                      # Show the shortcut help
    refresh: "r"                   # Refetch every cached query
    cancel: "escape"               # Clear the active filter
    quit: "q"                      # Quit the app

  timeline:
    down: ["j", "down"]
    up: ["k", "up"]
    move_top: "g"
    move_bottom: "G"
    jump_today: "T"
    prev_day: "["
    next_day: "]"
    undo: ["u", "U"]               # Restore the last deleted note
    quick_capture: ["n", "c"]      # Open 1-line quick capture input
    edit_entry: "e"                # Edit the selected note inline
    edit_project: "p"              # Reassign the note to another project
    edit_tags: "t"                 # Edit the note's tags
    delete_entry: "d"              # Delete the note (with confirmation)
    open_editor: "o"               # Edit the note in $EDITOR

  projects:
    down: ["j", "down"]
    up: ["k", "up"]
    new_project: ["n", "N"]        # Create a project
    edit_project_settings: "P"     # Edit the project's routine & policy
    edit_project_content: ["e", "o"] # Edit the project markdown in $EDITOR

  dashboard:
    day_prev: ["h", "left"]        # Focus the previous chart day
    day_next: ["l", "right"]       # Focus the next chart day
    toggle_routine: ["space", " "] # Complete today's due routine
    open_day: "return"             # Open the focused day in the timeline
    quick_capture: ["n", "c"]      # Open 1-line quick capture input

  reflections:
    down: ["j", "down"]
    up: ["k", "up"]
    cadence_week: ["w", "W"]
    cadence_month: ["m", "M"]
    cadence_quarter: "Q"
    cadence_year: ["y", "Y"]
    open_reflection: ["e", "return"] # Write the reflection in $EDITOR

  modal:
    submit: ["return", "kpenter"]  # Save the modal input
    cancel: "escape"               # Close the modal without saving
    suggestion_next: "down"        # Highlight the next suggestion
    suggestion_prev: "up"          # Highlight the previous suggestion
    suggestion_accept: "tab"       # Complete with the highlighted suggestion
    confirm: "y"                   # Confirm a destructive action
    decline: "n"                   # Decline a destructive action
    draft_in_editor: "e"           # Ctrl+E: write the buffer in $EDITOR

# ==========================================
# QUICK ADD DEFAULTS
# ==========================================
quick_add:
  default_project: "Inbox"         # Default project if @project is omitted in quick capture

# ==========================================
# PERIODIC REFLECTIONS
# ==========================================
reflections:
  start_date: "2026-01-01"         # Earliest start date for reflection periods (YYYY-MM-DD)

# ==========================================
# SERVER & STORAGE OPTIONS
# ==========================================
server:
  host: "127.0.0.1"
  port: 4321
  db_path: "~/.local/share/journals/data.sqlite"
  wal_mode: true                   # Enable SQLite Write-Ahead Logging for high concurrency
  auto_start: true                 # Automatically start backend server if not running
